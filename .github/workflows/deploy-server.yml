name: Deploy to home server

# Deploys the gateway + SPA to the always-on Mac (kl_2_server) over ZeroTier.
# The runner joins the ZeroTier network, SSHes in to fast-forward the checkout,
# rebuilds the SPA if web/ changed, restarts the gateway if gateway/ changed,
# verifies health, then leaves the ZeroTier network so no member lingers.
#
# Requires these repo secrets (Settings -> Secrets and variables -> Actions):
#   ZEROTIER_NETWORK_ID    the "pi" network id (60ee7c034a155af1)
#   ZEROTIER_CENTRAL_TOKEN API token that can authorize a new member on that network
#   ZEROTIER_HOST_IP       the server's ZeroTier IP (172.30.2.3)
#   REMOTE_USER            ssh user on the server (kl_2_server)
#   REMOTE_PASSWORD        that user's password

on:
  push:
    branches: [main]
    paths:
      - 'gateway/**'
      - 'web/**'
      - 'tools/**'
      - 'deploy/**'
      - '.github/workflows/deploy-server.yml'
  workflow_dispatch:

concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Join ZeroTier
        uses: zerotier/github-action@v1.0.1
        with:
          network_id: ${{ secrets.ZEROTIER_NETWORK_ID }}
          auth_token: ${{ secrets.ZEROTIER_CENTRAL_TOKEN }}

      - name: Wait for the server over ZeroTier
        shell: bash
        run: |
          for i in $(seq 1 30); do
            if ping -c1 -W2 "${{ secrets.ZEROTIER_HOST_IP }}" >/dev/null 2>&1; then
              echo "server reachable over ZeroTier"
              exit 0
            fi
            echo "waiting for ZeroTier route ($i)…"; sleep 2
          done
          echo "server never became reachable over ZeroTier" >&2
          exit 1

      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Deploy (pull, build, restart, verify)
        shell: bash
        env:
          SSHPASS: ${{ secrets.REMOTE_PASSWORD }}
          SSH_HOST: ${{ secrets.ZEROTIER_HOST_IP }}
          SSH_USER: ${{ secrets.REMOTE_USER }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "$SSH_USER@$SSH_HOST" bash -s <<'REMOTE'
          set -euo pipefail
          export PATH=/opt/homebrew/bin:/usr/local/bin:$PATH
          cd ~/matter-home

          git fetch origin main --quiet
          LOCAL=$(git rev-parse HEAD)
          REMOTE=$(git rev-parse origin/main)
          CHANGED=$(git diff --name-only "$LOCAL" "$REMOTE")
          echo "deploying $LOCAL -> $REMOTE"
          git reset --hard origin/main --quiet

          if echo "$CHANGED" | grep -q '^web/' || [ ! -f web/dist/manifest.json ]; then
            cd web
            if echo "$CHANGED" | grep -q '^web/package'; then npm install --no-audit --no-fund; fi
            npm run build
            cd ..
            echo "  web rebuilt"
          fi

          if echo "$CHANGED" | grep -q '^gateway/'; then
            launchctl kickstart -k "gui/$(id -u)/com.matterhome.gateway"
            echo "  gateway restarted"
          fi
          echo "deployed $(git rev-parse --short HEAD)"

          # health check
          TOKEN=$(grep -oE 'GW_TOKEN=.*' gateway/.env | cut -d= -f2)
          for i in $(seq 1 15); do
            if curl -fs -H "Authorization: Bearer $TOKEN" http://localhost:8788/api/health; then
              echo; echo "health OK"; exit 0
            fi
            sleep 2
          done
          echo "gateway health check failed" >&2
          exit 1
          REMOTE

      - name: Leave ZeroTier network
        if: always()
        shell: bash
        run: |
          # The ephemeral runner is destroyed after the job, but leave + deauthorize
          # explicitly so no stale member lingers on the network.
          NODE_ID=$(sudo zerotier-cli info 2>/dev/null | awk '{print $3}')
          sudo zerotier-cli leave "${{ secrets.ZEROTIER_NETWORK_ID }}" || true
          if [ -n "${NODE_ID:-}" ]; then
            curl -s -X POST \
              -H "Authorization: Bearer ${{ secrets.ZEROTIER_CENTRAL_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d '{"config":{"authorized":false}}' \
              "https://my.zerotier.com/api/v1/network/${{ secrets.ZEROTIER_NETWORK_ID }}/member/${NODE_ID}" \
              >/dev/null || true
            echo "deauthorized runner member $NODE_ID"
          fi
